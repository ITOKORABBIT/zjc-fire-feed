name: 抓取消防即時案件

on:
  schedule:
    - cron: '*/10 * * * *'   # 每 10 分鐘（GitHub 排程常有數分鐘延遲）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node fetch.mjs
      - name: 有變動才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fire-cases.json
          git diff --staged --quiet || git commit -m "更新消防即時案件 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
