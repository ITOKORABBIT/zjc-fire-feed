name: 抓取消防即時案件

# ⚠️ 排程已停用。
# 2026-08-19 實測：GitHub runner 連不到 119.hcfd.gov.tw（ConnectTimeout 10s），
# Cloudflare Workers 也一樣（522）。消防局擋機房 IP，只有台灣一般網路連得到。
# 改由老大電腦上的 Windows 工作排程「莊競程-消防即時案件」每 10 分鐘執行 fetch.mjs 並推上來。
# 這裡只留手動觸發，方便日後對方放行時直接驗證是否恢復。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node fetch.mjs
      - name: 有變動才提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fire-cases.json
          git diff --staged --quiet || git commit -m "更新消防即時案件 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
